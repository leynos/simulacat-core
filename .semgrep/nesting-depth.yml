rules:
  - id: simulacat.ts.nesting-depth
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Function nests control-flow blocks deeper than 3 levels. Extract
      predicates or helper functions before adding another nested block.
    pattern-either:
      - pattern: |
          function $F(...) {
            ...
            if (...) {
              ...
              if (...) {
                ...
                if (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          }
      - pattern: |
          function $F(...) {
            ...
            for (...) {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          }
      - pattern: |
          const $F = (...) => {
            ...
            if (...) {
              ...
              if (...) {
                ...
                if (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          };
      - pattern: |
          function $F(...) {
            ...
            switch ($VALUE) {
              case $CASE:
                ...
                if (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
            }
          }
      - pattern: |
          const $F = (...) => {
            ...
            switch ($VALUE) {
              case $CASE:
                ...
                if (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
            }
          };
      - pattern: |
          function $F(...) {
            ...
            try {
              ...
              if (...) {
                ...
                if (...) {
                  ...
                }
              }
            } catch ($ERROR) {
              ...
            }
          }
      - pattern: |
          const $F = (...) => {
            ...
            try {
              ...
              if (...) {
                ...
                if (...) {
                  ...
                }
              }
            } catch ($ERROR) {
              ...
            }
          };
      - pattern: |
          function $F(...) {
            ...
            for (const $ITEM of $ITEMS) {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          }
      - pattern: |
          const $F = (...) => {
            ...
            for (const $ITEM of $ITEMS) {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          };
      - pattern: |
          function $F(...) {
            ...
            for (const $KEY in $OBJECT) {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          }
      - pattern: |
          const $F = (...) => {
            ...
            for (const $KEY in $OBJECT) {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            }
          };
      - pattern: |
          function $F(...) {
            ...
            do {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            } while (...);
          }
      - pattern: |
          const $F = (...) => {
            ...
            do {
              ...
              if (...) {
                ...
                while (...) {
                  ...
                  if (...) {
                    ...
                  }
                }
              }
            } while (...);
          };
