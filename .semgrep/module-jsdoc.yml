rules:
  - id: simulacat.ts.module-jsdoc
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
    message: >-
      JS/TS files must start with module-level JSDoc, preferably an @file
      block, after any shebang, license block, or 'use strict' directive.
    pattern-regex: |-
      \A(?!(?:#![^\n]*\n)?(?:/\*![\s\S]*?\*/\s*)?(?:(?:'use strict'|"use strict");\s*\n)?\s*/\*\*[\s\S]*?@file)
