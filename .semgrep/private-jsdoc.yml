rules:
  - id: simulacat.ts.private-jsdoc
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
    message: >-
      Private/internal JS/TS functions need a concise one-line JSDoc summary.
    pattern-regex: |-
      (?m)(?<!\*/\n)(?<!\*/\n\n)(?<!\*/\n\n\n)(?<!\*/\n\n\n\n)(?<!\*/\n\n\n\n\n)(?<!\*/\n\n\n\n\n\n)^\s*(?!export\s+)(?:async\s+function\s+\w+|function\s+\w+|const\s+\w+\s*=\s*(?:async\s*)?\([^)]*\)\s*=>)
