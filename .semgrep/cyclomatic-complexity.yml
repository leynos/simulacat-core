rules:
  - id: simulacat.ts.cyclomatic-complexity
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
    message: >-
      Function appears to exceed McCabe/C90 cyclomatic complexity 8. This is a
      Semgrep heuristic over decision tokens; refactor or justify a narrow
      suppression.
    pattern-regex: |-
      (?s)(?:export\s+)?(?:async\s+)?(?:function\s+\w+|\w+\s*[:=]\s*(?:async\s*)?\([^)]*\)\s*=>|(?:public|private|protected)?\s*(?:async\s+)?\w+\s*\([^)]*\)\s*\{)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)(?:(?!\n\}).)*(?:\bif\b|\belse\s+if\b|\bcase\b|\bcatch\b|&&|\|\||\?)
